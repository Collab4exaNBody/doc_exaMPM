[project]
dev_addr = "127.0.0.1:8000"
site_name = "exaMPM"
site_description = "exaMPM: Material Point Method on top of onika and exaNBody"
repo_url = "https://github.com/Collab4exaNBody/exaMPM"
repo_name = "Collab4exaNBody/exaMPM"
copyright = "Copyright &copy; 2026 exaMPM developers"
use_directory_urls = false
nav = [
    {"Home" = "index.md"},
    {"Overview" = [
        "Overview/overview.md",
        {"Features" = "Overview/features.md"},
        {"Code evolution" = "Overview/releases.md"}
    ]},
    {"Build & Install" = [
        "BuildInstall/index.md",
        "BuildInstall/cmake_installation.md",
        "BuildInstall/running.md"
    ]},
    {"Beginner Guide" = [
        "Beginner/index.md",
        {"Getting Started" = [
            "Beginner/GettingStarted/index.md",
            "Beginner/GettingStarted/building_blocks.md",
            "Beginner/GettingStarted/configuration_files.md",
            "Beginner/GettingStarted/yaml_basics.md"
        ]},
        {"Simulation Starter Pack" = [
            "Beginner/StarterPack/index.md",
            "Beginner/StarterPack/1_global.md",
            "Beginner/StarterPack/2_domain.md",
            "Beginner/StarterPack/3_material_points.md",
            "Beginner/StarterPack/4_obstacles.md",
            "Beginner/StarterPack/5_constitutive_model.md",
            "Beginner/StarterPack/6_numerical_scheme.md",
            "Beginner/StarterPack/7_output.md",
            "Beginner/StarterPack/8_example.md"
        ]}
    ]},
    {"User Guide" = [
        "User/index.md",
        {"Simulation Graph" = [
            "User/SimulationGraph/index.md",
            "User/SimulationGraph/default_yaml.md"
        ]},
        {"Background Grid" = "User/Grid/index.md"},
        {"Material Points" = [
            "User/MaterialPoints/index.md",
            "User/MaterialPoints/fields.md",
            "User/MaterialPoints/setters.md",
            "User/MaterialPoints/blender_files.md"
        ]},
        {"Constitutive Models" = [
            "User/ConstitutiveModels/index.md",
            "User/ConstitutiveModels/mohr_coulomb.md",
            "User/ConstitutiveModels/hooke_elasticity.md"
        ]},
        {"Obstacles & Contacts" = [
            "User/Obstacles/index.md",
            "User/Obstacles/sphere.md",
            "User/Obstacles/plane.md",
            "User/Obstacles/cylinder.md",
            "User/Obstacles/left_biplanar.md",
            "User/Obstacles/blender_obstacles.md",
            "User/Obstacles/contact_law.md"
        ]},
        {"Numerical Scheme" = "User/NumericalScheme/index.md"},
        {"Outputs" = [
            "User/Outputs/index.md",
            "User/Outputs/visualization.md"
        ]},
        {"Exhaustive Operator List" = "User/Operators/index.md"}
    ]},
    {"Tutorials" = [
        "Tutorials/index.md",
        "Tutorials/sphere_impacting_structure.md",
        "Tutorials/config_a1.md",
        "Tutorials/sphere_on_slope.md",
        "Tutorials/slope_two_layers.md",
        "Tutorials/piles_one.md"
    ]},
    {"Developer Guide" = [
        "Developer/index.md",
        "Developer/new_operator.md",
        "Developer/gpu_kernels.md",
        "Developer/coding_rules.md",
        "Developer/tests.md"
    ]},
    {"References" = "References/index.md"},
    {"About" = "About/index.md"}
]

extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js"
]

extra_css = [
    "styles/extra_styles.css"
]

[project.theme]
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tooltips",
    "content.footnote.tooltips",
    "search.highlight",
    "navigation.footer",
    "navigation.top",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.tracking",
    "navigation.sections",
    "navigation.indexes"
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
logo = "lucide/mountain"
repo = "fontawesome/brands/github"
next = "fontawesome/solid/angle-right"
edit = "material/pencil"
view = "material/eye"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.abbr]
[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
use_pygments = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.md_in_html]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.def_list]

[project.markdown_extensions.toc]
toc_depth = 4
permalink = true
